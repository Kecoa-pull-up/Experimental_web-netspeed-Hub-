<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}NetSpeed Hub - Teknisi{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-layout">
        <div class="sidebar">
            <div class="sidebar-brand"><i class="ti ti-bolt"></i> NetSpeed Hub</div>
            <a href="{{ url_for('dashboard_teknisi') }}" class="nav-item"><i class="ti ti-layout-dashboard"></i> Dashboard</a>
            <a href="{{ url_for('jaringan') }}" class="nav-item"><i class="ti ti-wifi"></i> Jaringan</a>
            <a href="{{ url_for('logout') }}" class="nav-item nav-logout"><i class="ti ti-logout"></i> Logout</a>
        </div>
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
